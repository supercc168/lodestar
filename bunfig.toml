[test]
# 顺序敏感,test-preload 必须是第一项(上游 b264b60):
# 1. test-preload.ts 隔离宿主 config/XDG 运行状态 —— mkdtemp 临时根 + 写最小
#    config.toml + 注入 LODESTAR_CONFIG/LODESTAR_DATA_DIR/CODEX_HOME/
#    CLAUDE_CONFIG_DIR。src/config.ts 在模块加载时即读 CONFIG_FILE,env 必须
#    先于任何读 paths/config 的模块设置。
# 2. feishu-test-mock.ts 先于任何测试文件注册 ./feishu 的共享 mock。
#    bun 的 mock.module 是异步注册,静态 import 间无 await 点:一旦某个被测模块
#    (如 notify.ts → ./feishu)在 mock 生效前被加载,真实 feishu 会被缓存,
#    后续 session.test.ts 等拿到的就是真实模块。
#    preload 保证 mock 在首个测试文件加载前注册,加载顺序不再影响结果。
preload = ["./src/test-preload.ts", "./src/feishu-test-mock.ts"]
